services:
  app:
    build: .
    ports:
      - "3824:8080"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_KEY=${APP_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    env_file:
      - .env
    volumes:
      - app-storage:/var/www/html/storage

volumes:
  app-storage:
